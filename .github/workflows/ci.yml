name: AETHER-LOOP Physics & SRE CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-mechanics-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 11 Deterministic Pytest Unit & Integration Tests
        run: pytest tests/test_tools_ci.py -v

      - name: Run 6-DOF Mechanics & 100-Rollout Monte Carlo Benchmark
        run: python scripts/benchmark_mechanics.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build Production Frontend Bundle
        run: |
          cd frontend
          npm install
          npm run build

